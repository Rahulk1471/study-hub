<style>

*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}

.btn:active{transform:scale(.97)}.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.d{color:var(--red)}.btn.s{padding:4px 10px;font-size:13px}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}

dialog::backdrop{background:rgba(5,8,20,.55)}dialog[open]{animation:pop .15s ease}@keyframes pop{from{opacity:0;transform:scale(.97)}}

.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:7px 8px;border-top:1px solid var(--line);font-size:14px}
@media(max-width:760px){.app{display:block}nav{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;flex-direction:row;overflow-x:auto;border:0;border-top:1px solid var(--line);background:var(--card);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}nav .logo{display:none}nav button{flex-direction:column;gap:0;font-size:11px;padding:6px 10px;white-space:nowrap}h1{font-size:22px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* surfaces: base < card < elevated (hover) < modal */

function fzApply(){const f=P.fz,ds=new Set(S.sessions.map(s=>s.date)),used=new Set(f.used);let L=null;for(let i=1;i<=400;i++){const d=addD(-i);if(ds.has(d)||used.has(d)){L=d;break}}

 let n=0;A.forEach(([id,t])=>{if(!P.ach[id]){P.ach[id]={d:day(),t};n++;setTimeout(()=>{toast('🏅 Achievement: '+t);snd('level')},300+n*2300)}});if(n)pSave()}

function xpTotal(){const m=S.sessions.reduce((a,s)=>a+s.min,0),td=S.topics.filter(isDone).length,tk=S.tasks.filter(t=>t.status==='done').length+Object.values(S.daily||{}).reduce((a,L)=>a+L.filter(x=>x.done).length,0),cr=S.cards.reduce((a,c)=>a+(c.reps||0),0),rv=S.topics.reduce((a,t)=>a+(t.rlog||[]).length,0);return Math.round(m+20*td+10*tk+2*cr+5*rv)}

/* ---------- reminders with personality ---------- */
function ping(msg,mode){const o=$('#brk');if(o)o.remove();const e=document.createElement('div');e.id='brk';e.className='toast brk';e.setAttribute('role','alert');const s=document.createElement('span');s.textContent=(mode==='brk'?'☕ ':'📚 ')+msg;const a=document.createElement('button');a.className='btn s p';a.textContent=mode==='brk'?'Pause timer':'Start session';a.onclick=()=>{e.remove();if(mode==='brk'){if(timer.on)tPause()}else go('log')};const b=document.createElement('button');b.className='btn s';b.textContent=mode==='brk'?'Dismiss':'Later';b.onclick=()=>e.remove();e.append(s,a,b);if(e.showPopover)e.popover='manual';document.body.append(e);try{e.showPopover&&e.showPopover()}catch(x){}snd('brk');setTimeout(()=>e.remove(),60000);
 try{if('Notification' in window&&Notification.permission==='granted'&&document.hidden)new Notification(mode==='brk'?'Study break':'Study reminder',{body:msg})}catch(x){}}
function remind(msg){hap([200,100,200]);ping(msg,'brk')}
function brkCheck(){if(!timer.on||S.settings.brk===false)return;const m=timeNow()/6e4,ev=Math.max(15,+S.settings.brkEvery||50),k=Math.floor(m/ev);
 if(m>=120&&!timer.f2){timer.f2=true;timer.bm=k;timerSave();return remind("You've been studying for 2 hours. Take a break.")}
 if(k>(timer.bm||0)){timer.bm=k;timerSave();remind('Time for a short break. You have studied '+Math.round(m)+' minutes.')}}
setInterval(brkCheck,15000);
function nudgeText(){const top=Q.plan()[0],sn=top?top.sub.name:'',y=dList(addD(-1)).filter(x=>!x.done),fun=[];if(sn)fun.push(sn+' is still sitting there.',sn+' has not gone anywhere. Neither have your deadlines.','Your '+sn+' notes are getting lonely.');if(y.length)fun.push('You said you would finish this yesterday: '+y[0].text,'You said you would finish this yesterday.');
 return Math.random()<.4&&fun.length?pick(fun):(sn?'Reminder: Study '+sn:'Reminder: time to study')}
function nudgeTick(){const t=S.settings.remAt;if(!/^\d\d:\d\d$/.test(t||''))return;const n=new Date(),hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');if(hm<t||P.nudged===day()||Q.minToday()>0||timer.on||timer.acc>0)return;P.nudged=day();pSave();hap([120,80,120]);ping(nudgeText(),'nudge')}
setInterval(nudgeTick,20000);
